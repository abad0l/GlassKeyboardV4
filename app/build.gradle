plugins { id 'com.android.application' }

android {
    namespace 'com.example.glasskeyboard'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.glasskeyboard'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    // One fixed key for every build, so a new APK installs over the old one without uninstalling.
    signingConfigs {
        shared {
            storeFile file('glass.keystore')
            storePassword 'glasskeyboard'
            keyAlias 'glass'
            keyPassword 'glasskeyboard'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
